<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コトバ最適化 LAB v0.1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#f4f6fa;color:#18243a;margin:0}main{max-width:850px;margin:30px auto;padding:20px}h1{margin-bottom:4px}small{color:#64748b}.panel{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin:18px 0}textarea,select,input{box-sizing:border-box;width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:12px;font:inherit}textarea{min-height:145px}label{display:block;font-weight:600;margin:14px 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{background:#1d4ed8;color:white;border:0;border-radius:9px;padding:11px 17px;font-weight:700;cursor:pointer;margin:8px 6px 0 0}button.secondary{background:#e8edf8;color:#20345a}.result{border:1px solid #dbe4f2;border-radius:12px;padding:15px;margin:12px 0;white-space:pre-wrap;line-height:1.65}.result h3{margin:0 0 8px}.note{color:#475569;font-size:14px}.pill{display:inline-block;background:#e9efff;color:#1d4ed8;border-radius:99px;padding:5px 10px;font-size:12px}#feedback{min-height:80px}@media(max-width:600px){main{margin:0;padding:12px}.grid{grid-template-columns:1fr}}</style></head><body><main><span class="pill">試作版 v0.1 ・ オフライン動作</span><h1>コトバ最適化 LAB</h1><small>思いつくまま書く → 伝わる言葉を比較する</small><section class="panel"><label for="raw">今、伝えたいこと</label><textarea id="raw" placeholder="例：説明が長すぎて何が言いたいのかわからない。要点だけ教えてほしい。"></textarea><div class="grid"><div><label for="target">伝える相手</label><select id="target"><option value="person">人間</option><option value="ai">AI</option><option value="self">自分の思考整理</option></select></div><div><label for="goal">目的</label><select id="goal"><option value="clear">正確に伝える</option><option value="request">行動を促す・依頼する</option><option value="feel">気持ちを伝える</option><option value="organize">考えを整理する</option></select></div></div><label for="context">背景・譲れない条件（任意）</label><textarea id="context" style="min-height:75px" placeholder="例：相手を責めたいわけではない。結論を先に知りたい。"></textarea><button id="run">3案を作成</button><button class="secondary" id="example">例文を入れる</button><button class="secondary" id="reset">クリア</button></section><section class="panel" id="output" hidden><h2>表現候補</h2><p class="note">この試作版は端末内のルールで文章を整えます。AIによる意味理解・自動生成は未搭載です。</p><div id="results"></div><h3>表現の考え方</h3><div class="result" id="reason"></div><label for="feedback">使ってみた感想・改善したいこと</label><textarea id="feedback" placeholder="例：自然案が丁寧すぎる。もっと率直な表現がほしい。"></textarea><button id="save">フィードバックを保存</button><button class="secondary" id="export">記録をJSONで書き出す</button><p id="status" class="note"></p></section></main><script>
const $=id=>document.getElementById(id);let current=null;const clean=s=>s.trim().replace(/\s+/g,' ').replace(/([。！？!?])\1+/g,'$1');const end=s=>/[。！？!?]$/.test(s)?s:s+'。';function build(){let raw=clean($('raw').value);if(!raw){alert('まず伝えたいことを入力してください');return}let target=$('target').value,goal=$('goal').value,ctx=clean($('context').value);let natural,clear,strong;if(target==='ai'){natural=`次の内容について対応してください。\n\n${end(raw)}${ctx?'\n\n補足条件：'+ctx:''}\n\n必要な点があれば確認してください。`;clear=`【目的】${({clear:'内容を正確に伝える',request:'具体的な対応を依頼する',feel:'意図や感情を適切に表現する',organize:'考えを整理する'})[goal]}\n【依頼内容】${end(raw)}\n【条件】${ctx||'不明点は推測で断定せず、確認する'}\n【出力】結論を先に、簡潔かつ具体的に示す。`;strong=`${end(raw)}\n${ctx?'必ず守る条件：'+ctx+'\n':''}結論を最初に示し、曖昧な説明を避けてください。`; }else if(target==='self'){natural=`今考えていること：${end(raw)}${ctx?'\n気になっている条件：'+ctx:''}`;clear=`【いまの考え】${end(raw)}\n【大事な条件】${ctx||'まだ整理できていない'}\n【次に考えること】何を一番伝えたいのか？`;strong=`自分の本音：${end(raw)}\n${ctx?'譲れないこと：'+ctx:'まず本音を否定せずに整理する。'}`;}else{natural=`${end(raw)}${ctx?'\n補足すると、'+end(ctx):''}`;clear=`お伝えしたいことは、${end(raw)}${ctx?'\nその際、'+end(ctx):''}`;strong=`${end(raw)}${ctx?'\n'+end(ctx):''}\nこの点を重視しています。`;}current={date:new Date().toISOString(),raw,target,goal,context:ctx,variants:{natural,clear,strong}};let labels=[['natural','自然な表現','元の言い方をなるべく残す'],['clear','明確な表現','構造化して誤解を減らす'],['strong','強めの表現','主張や優先事項をはっきりさせる']];$('results').innerHTML='';for(let [k,title,desc] of labels){let div=document.createElement('div');div.className='result';let h=document.createElement('h3');h.textContent=title;let p=document.createElement('p');p.textContent=current.variants[k];let n=document.createElement('div');n.className='note';n.textContent=desc;let b=document.createElement('button');b.className='secondary';b.textContent='コピー';b.onclick=()=>navigator.clipboard.writeText(current.variants[k]).then(()=>{$('status').textContent='コピーしました'}).catch(()=>{$('status').textContent='コピーできませんでした。文章を選択してコピーしてください。'});div.append(h,n,p,b);$('results').append(div)}$('reason').textContent=target==='ai'?'AI向けでは、依頼内容・条件・出力形式を分けると意図が明確になります。':target==='self'?'思考整理では、事実・本音・条件を分けることで次に考えるべきことが見えやすくなります。':'対人表現では、元の言葉を尊重しながら、明確さと主張の強さを切り替えています。';$('output').hidden=false;$('output').scrollIntoView({behavior:'smooth'});}function download(obj){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kotoba-lab-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('run').onclick=build;$('example').onclick=()=>{$('raw').value='説明が長すぎて何が言いたいのかわからない。要点だけ教えてほしい。';$('context').value='相手を責めたいわけではない。結論を先に知りたい。';};$('reset').onclick=()=>{$('raw').value='';$('context').value='';$('output').hidden=true};$('save').onclick=()=>{if(!current)return;let logs=JSON.parse(localStorage.getItem('kotobaLogs')||'[]');logs.push({...current,feedback:$('feedback').value});localStorage.setItem('kotobaLogs',JSON.stringify(logs));$('status').textContent='このブラウザに保存しました。必要に応じてJSONを書き出してください。'};$('export').onclick=()=>download({version:'0.1',logs:JSON.parse(localStorage.getItem('kotobaLogs')||'[]'),latest:current,feedback:$('feedback').value});</script></body></html>
