<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f8f7f3"><title>瞬記 — すぐ残す</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#202322;background:#f8f7f3}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:20px 17px 70px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}h1{font-size:26px;letter-spacing:.08em;margin:0}small,.muted{color:#777}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 15px;background:#eae9e3;color:#202322}button.primary{background:#1e4138;color:white}button:disabled{opacity:.5}textarea{width:100%;min-height:205px;resize:vertical;border:1px solid #e2e2dc;border-radius:17px;padding:17px;font:18px/1.7 -apple-system,BlinkMacSystemFont,sans-serif;background:white;outline:none}textarea:focus{border-color:#567d6f}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status{font-size:12px;color:#67756d;margin-top:9px;min-height:20px}h2{font-size:17px;margin:35px 0 14px}.entry{background:white;border:1px solid #e9e9e4;border-radius:15px;padding:15px;margin-bottom:10px}.entry p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;margin:9px 0}.entry .actions{display:flex;gap:7px;justify-content:flex-end}.entry button{font-size:12px;padding:7px 10px}.entry time{font-size:12px;color:#777}input[type=search]{width:100%;border:1px solid #ddd;border-radius:12px;padding:13px;font-size:16px;background:white}.note{font-size:12px;color:#777;line-height:1.6;margin-top:18px}.empty{color:#888;text-align:center;padding:32px}#voiceStatus{font-size:13px;color:#446c5e} </style></head><body><main><header><div><h1>瞬記 <small>shunki</small></h1><small>思いついたら、すぐ残す。</small></div><button id="exportBtn">ログ保存 ↓</button></header><textarea id="draft" placeholder="いま、思ったことをそのまま…" aria-label="日記を入力"></textarea><div class="toolbar"><button class="primary" id="saveBtn">記録する</button><button id="voiceBtn">🎙 音声入力</button><button id="clearBtn">入力を消す</button></div><div class="status" id="status">入力途中も自動保存されます</div><div id="voiceStatus"></div><h2>これまでの記録 <span id="count" class="muted"></span></h2><input type="search" id="search" placeholder="記録を検索"><div id="entries"></div><div class="toolbar"><button id="txtBtn">テキスト書き出し</button><button id="importBtn">JSON読み込み</button><input type="file" id="file" accept="application/json,.json" hidden></div><p class="note">記録はこのブラウザ内に保存されます。端末変更やブラウザデータ削除に備え、定期的に「ログ保存」でJSONバックアップしてください。別端末との自動同期はありません。音声入力は対応ブラウザのみ利用可能です。iPhoneではキーボードのマイクからも音声入力できます。</p></main><script>
const KEY='shunki.entries.v1',DRAFT='shunki.draft.v1';let entries=[],editing=null;const $=id=>document.getElementById(id);try{entries=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(entries))entries=[]}catch{entries=[]}try{$('draft').value=localStorage.getItem(DRAFT)||''}catch{}function persist(){try{localStorage.setItem(KEY,JSON.stringify(entries));return true}catch(e){status('保存できません。この開き方では端末内保存が制限されています。Safariで公開URLから開いてください。');alert('記録を保存できませんでした。ファイルアプリ内では保存が制限される場合があります。文章をコピーして保管し、Safariで公開されたアプリを開いてください。');return false}}function render(){let q=$('search').value.trim().toLowerCase();let found=entries.filter(e=>e.text.toLowerCase().includes(q));$('count').textContent=`(${entries.length})`;$('entries').replaceChildren();if(!found.length){let d=document.createElement('div');d.className='empty';d.textContent=q?'該当する記録はありません':'まだ記録がありません';$('entries').append(d)}for(let e of found){let div=document.createElement('article');div.className='entry';let t=document.createElement('time');t.textContent=new Date(e.created).toLocaleString('ja-JP');let p=document.createElement('p');p.textContent=e.text;let a=document.createElement('div');a.className='actions';let edit=document.createElement('button');edit.textContent='編集';edit.onclick=()=>{editing=e.id;$('draft').value=e.text;$('saveBtn').textContent='変更を保存';$('draft').focus();scrollTo({top:0,behavior:'smooth'})};let del=document.createElement('button');del.textContent='削除';del.onclick=()=>{if(confirm('この記録を削除しますか？')){entries=entries.filter(x=>x.id!==e.id);persist();render()}};a.append(edit,del);div.append(t,p,a);$('entries').append(div)}}function status(s){$('status').textContent=s}function save(){let previous=JSON.parse(JSON.stringify(entries));let text=$('draft').value.trim();if(!text){status('文章を入力してください');return}if(editing){let e=entries.find(x=>x.id===editing);if(e){e.text=text;e.updated=new Date().toISOString()}}else{entries.unshift({id:(window.crypto&&typeof crypto.randomUUID==='function')?crypto.randomUUID():String(Date.now())+Math.random(),created:new Date().toISOString(),text})}if(!persist()){entries=previous;return}editing=null;$('draft').value='';try{localStorage.removeItem(DRAFT)}catch{}$('saveBtn').textContent='記録する';status('保存しました ✓');render()}$('saveBtn').onclick=save;$('draft').oninput=()=>{try{localStorage.setItem(DRAFT,$('draft').value);status('入力途中を保存しました')}catch{status('この環境では下書きを自動保存できません。文章をコピーして保管してください')}};$('clearBtn').onclick=()=>{if($('draft').value&&!confirm('入力中の文章を消しますか？'))return;$('draft').value='';editing=null;try{localStorage.removeItem(DRAFT)}catch{}$('saveBtn').textContent='記録する';status('入力を消しました')};$('search').oninput=render;function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}const day=()=>new Date().toISOString().slice(0,10);$('exportBtn').onclick=()=>download('shunki-backup-'+day()+'.json',JSON.stringify({app:'shunki',version:1,exported:new Date().toISOString(),entries},null,2),'application/json');$('txtBtn').onclick=()=>download('shunki-log-'+day()+'.txt',entries.map(e=>'['+new Date(e.created).toLocaleString('ja-JP')+']\n'+e.text).join('\n\n---\n\n'),'text/plain;charset=utf-8');$('importBtn').onclick=()=>$('file').click();$('file').onchange=async ev=>{let f=ev.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.entries))throw Error('形式が違います');let valid=data.entries.filter(e=>typeof e.id==='string'&&typeof e.text==='string'&&typeof e.created==='string');if(!confirm(valid.length+'件を読み込み、現在の記録と統合しますか？'))return;let m=new Map(entries.map(e=>[e.id,e]));valid.forEach(e=>m.set(e.id,e));entries=[...m.values()].sort((a,b)=>new Date(b.created)-new Date(a.created));persist();render();status(valid.length+'件を読み込みました')}catch(e){alert('読み込みできません: '+e.message)}finally{ev.target.value=''}};let SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;if(SR){rec=new SR();rec.lang='ja-JP';rec.continuous=true;rec.interimResults=false;let active=false;rec.onresult=ev=>{let t='';for(let i=ev.resultIndex;i<ev.results.length;i++)if(ev.results[i].isFinal)t+=ev.results[i][0].transcript;let d=$('draft');d.value+=(d.value&&!/\s$/.test(d.value)?'\n':'')+t;d.dispatchEvent(new Event('input'))};rec.onstart=()=>{active=true;$('voiceBtn').textContent='■ 音声入力を停止';$('voiceStatus').textContent='聞き取り中…'};rec.onend=()=>{active=false;$('voiceBtn').textContent='🎙 音声入力';$('voiceStatus').textContent=''};rec.onerror=e=>$('voiceStatus').textContent='音声入力エラー: '+e.error;$('voiceBtn').onclick=()=>{if(active)rec.stop();else try{rec.start()}catch{}}}else{$('voiceBtn').onclick=()=>{$('draft').focus();$('voiceStatus').textContent='このブラウザではボタン式の音声認識に非対応です。iPhoneキーボードのマイクを使ってください。'}}render();
</script></body></html>
